name: Build APK & Publish

on:
  push:
    branches: [master, islam_auth, islam_cicd, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build APK & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required secrets
        run: |
          # We use a simple list and check if the env var is set
          for var in API_BASE_URL GRAPHQL_ENDPOINT MAPTILER_API_KEY GDRIVE_CREDENTIALS FOLDER_ID; do
            if [ -z "$(eval echo \$$var)" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT: ${{ secrets.GRAPHQL_ENDPOINT }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          FOLDER_ID: ${{ secrets.FOLDER_ID }}

      - name: Create .env file
        run: |
          cat > .env << EOF
          APP_NAME=ZeroWaste
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT=${{ secrets.GRAPHQL_ENDPOINT }}
          ENABLE_ANALYTICS=false
          MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
          MAP_DEFAULT_LATITUDE=35.21029256506365
          MAP_DEFAULT_LONGITUDE=-0.6348826555869873
          MAP_DEFAULT_ZOOM=12
          EOF

      - name: Install dependencies & Build Runner
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analysis and Test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --exclude-tags=requires_env

      - name: Build APK
        run: flutter build apk --release
              
      - name: Upload APK to Slack
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          # Define the filename with the build number
          FILENAME="ZeroWaste-v${{ github.run_number }}.apk"
          
          # Upload the file using the Slack API
          curl -F file=@build/app/outputs/flutter-apk/app-release.apk \
               -F "initial_comment=🚀 *New Build Ready!* (Run #${{ github.run_number }})" \
               -F "channels=${CHANNEL_ID}" \
               -F "filename=${FILENAME}" \
               -H "Authorization: Bearer ${SLACK_TOKEN}" \
               https://slack.com/api/files.uploadV2