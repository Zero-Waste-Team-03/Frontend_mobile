name: Build APK & Publish

on:
  push:
    branches: [master, islam_auth, islam_cicd, develop]
  workflow_dispatch:

# Cancel any in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build APK & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java (required by Gradle) ─────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Flutter ───────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT: ${{ secrets.GRAPHQL_ENDPOINT }}
        run: |
          missing=0
          for v in API_BASE_URL GRAPHQL_ENDPOINT; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      
        
      # ── Create .env (app/test runtime config) ─────────────────
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          APP_NAME=ZeroWaste
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT=${{ secrets.GRAPHQL_ENDPOINT }}
          ENABLE_ANALYTICS=false
          EOF

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test --exclude-tags=requires_env
      
      - name: Build APK
        run: flutter build apk --release
              
      - name: Prepare APK for upload
        run: |
          # Create the local directory named 'apk'
          mkdir -p apk
          # Copy (or move) the file into the new folder with your desired naming
          cp build/app/outputs/flutter-apk/app-release.apk apk/app-release-v${{ github.run_number }}.apk

      - name: Upload APK to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: apk/app-release-v${{ github.run_number }}.apk
          folderId: ${{ secrets.FOLDER_ID }}
          overwrite: "true"

