name: Build APK & Publish

on:
  push:
    branches: [master, islam_auth, islam_cicd, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build APK & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required secrets
        run: |
          for var in API_BASE_URL GRAPHQL_ENDPOINT MAPTILER_API_KEY SLACK_BOT_TOKEN SLACK_CHANNEL_ID; do
            if [ -z "$(eval echo \$$var)" ]; then
              echo "::error::Missing required secret: $var"
              exit 1
            fi
          done
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT: ${{ secrets.GRAPHQL_ENDPOINT }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Create .env file
        run: |
          cat > .env << EOF
          APP_NAME=ZeroWaste
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT=${{ secrets.GRAPHQL_ENDPOINT }}
          ENABLE_ANALYTICS=false
          MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
          MAP_DEFAULT_LATITUDE=35.21029256506365
          MAP_DEFAULT_LONGITUDE=-0.6348826555869873
          MAP_DEFAULT_ZOOM=12
          EOF

      - name: Install dependencies & Build Runner
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Analysis and Test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --exclude-tags=requires_env

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info || true
          
      - name: Check for APK existence
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            echo "::error::Build failed to produce arm64-v8a APK"
            exit 1
          fi

      - name: Upload APK to Slack (V2 API)
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          # The path now explicitly matches the arm64 output seen in your log
          FILE_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          
          if [ ! -f "$FILE_PATH" ]; then
            echo "::error::Target APK not found at $FILE_PATH"
            exit 1
          fi

          FILE_NAME="ZeroWaste-v${{ github.run_number }}-arm64.apk"
          FILE_SIZE=$(stat -c%s "$FILE_PATH")

          # 1. Get the Upload URL and File ID
          UPLOAD_JSON=$(curl -s -X POST "https://slack.com/api/files.getUploadURLExternal" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -d "filename=$FILE_NAME" \
            -d "length=$FILE_SIZE")
          
          UPLOAD_URL=$(echo $UPLOAD_JSON | jq -r '.upload_url')
          FILE_ID=$(echo $UPLOAD_JSON | jq -r '.file_id')

          if [ "$UPLOAD_URL" == "null" ] || [ "$UPLOAD_URL" == "" ]; then
            echo "Error: Could not get upload URL. Response: $UPLOAD_JSON"
            exit 1
          fi

          # 2. Upload the file bits
          curl -s -X POST "$UPLOAD_URL" --data-binary "@$FILE_PATH"

          # 3. Finalize upload to channel
          curl -s -X POST "https://slack.com/api/files.completeUploadExternal" \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"files\": [{\"id\": \"$FILE_ID\", \"title\": \"$FILE_NAME\"}],
              \"channel_id\": \"$CHANNEL_ID\",
              \"initial_comment\": \"🚀 *ZeroWaste Build Ready!* (Run #${{ github.run_number }} - arm64-v8a)\"
            }"