name: Build APK & Publish

on:
  push:
    branches: [master, islam_auth, islam_cicd, develop]
  workflow_dispatch:

# Cancel any in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build APK & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java (required by Gradle) ─────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Flutter ───────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT: ${{ secrets.GRAPHQL_ENDPOINT }}
          MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
        run: |
          missing=0
          for v in API_BASE_URL GRAPHQL_ENDPOINT MAPTILER_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      
        
      # ── Create .env (app/test runtime config) ─────────────────
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          APP_NAME=ZeroWaste
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GRAPHQL_ENDPOINT=${{ secrets.GRAPHQL_ENDPOINT }}
          ENABLE_ANALYTICS=false
          MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}
          MAP_DEFAULT_LATITUDE=35.21029256506365
          MAP_DEFAULT_LONGITUDE=-0.6348826555869873
          MAP_DEFAULT_ZOOM=12
          EOF

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        run: flutter test --exclude-tags=requires_env

      # ── Build APK ─────────────────────────────────────────────
      - name: Build release APK
        run: flutter build apk --release

      # ── Rename APK with version & commit info ─────────────────
      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date +'%Y%m%d')
          APK_NAME="gaspzero-${DATE}-${SHORT_SHA}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      # ── Upload APK as GitHub artifact (backup) ────────────────
      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # ── Post download links in job summary ─────────────────────
      - name: Display download links
        if: always()
        run: |
          echo "## 📦 APK Download" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Artifact:** available in this workflow run under Artifacts (name: \`release-apk\`)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** \`${{ env.APK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
