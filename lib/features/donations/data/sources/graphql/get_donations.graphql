query GetDonations(
  $pagination: PaginationInput
  $filter: DonationsFilterInput
  $searchName: String
) {
  donations(pagination: $pagination, filter: $filter, searchName: $searchName) {
    items {
      id
      createdAt
      title
      description
      quantity
      categoryId
      category {
        id
        name
      }
      status
      urgency
      isLikedByMe
      mainAttachmentId
      mainAttachment {
        url
      }
      locationId
      location {
        latitude
        longitude
      }
      user {
        id
        displayName
        email
        avatar {
          id
          url
        }
      }
    }
  }
}
