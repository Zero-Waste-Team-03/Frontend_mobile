mutation CreateDonation($input: CreateDonationInput!) {
  createDonation(input: $input) {
    id
    title
    description
    quantity
    foodWeightKg
    categoryId
    category {
      id
      name
    }
    status
    urgency
    isReservable
    mainAttachmentId
    mainAttachment {
      url
    }
    locationId
    location {
      latitude
      longitude
    }
    user {
      id
      displayName
      email
      avatar {
        id
        url
      }
    }
  }
}
