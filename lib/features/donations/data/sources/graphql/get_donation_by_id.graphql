query GetDonationById($id: ID!) {
  donation(id: $id) {
    id
    title
    description
    quantity
    categoryId
    category {
      id
      name
    }
    status
    urgency
    mainAttachmentId
    mainAttachment {
      url
    }
    imageUrl
    locationId
    location {
      latitude
      longitude
    }
    user {
      displayName
      email
    }
  }
}
