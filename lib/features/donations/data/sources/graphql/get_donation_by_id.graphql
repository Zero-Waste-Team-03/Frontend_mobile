query GetDonationById($id: ID!) {
  donation(id: $id) {
    id
    createdAt
    title
    description
    quantity
    categoryId
    category {
      id
      name
    }
    status
    urgency
    isLikedByMe
    isReservable
    mainAttachmentId
    mainAttachment {
      url
    }
    locationId
    location {
      latitude
      longitude
    }
    user {
      id
      displayName
      email
      avatar {
        id
        url
      }
    }
  }
}
