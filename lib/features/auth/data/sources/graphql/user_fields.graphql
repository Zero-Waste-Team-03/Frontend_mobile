fragment UserFields on User {
  id
  email
  displayName
  role
  description
  isVerified
  isFoodSaver
  phoneNumber
  reputationScore
  locationId
  location {
    id
    city
    country
    latitude
    longitude
    neighborhood
  }
  avatar {
    id
    url
    fileType
  }
  settings {
    id
    userId
    appearance
    isNewDonationsAlertsEnabled
    isSystemReports
    isUrgentAlertsEnabled
    isPushNotificationsEnabled
  }
}
