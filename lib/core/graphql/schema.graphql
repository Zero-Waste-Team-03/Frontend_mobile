
scalar DateTime
scalar JSON
scalar JSONObject

"""
Available UI themes for the application
"""
enum AppearanceTheme {
  DARK
  LIGHT
  SYSTEM
}

"""
Sensitivity level of a donation category
"""
enum CategorySensitivity {
  HIGH
  LOW
  MEDIUM
}

"""
The lifecycle status of a conversation
"""
enum ConversationStatus {
  ACTIVE
  ARCHIVED
  LOCKED
}

"""
Possible statuses for a donation listing
"""
enum DonationStatusValues {
  COMPLETED
  DRAFT
  EXPIRED
  PENDING_APPROVAL
  PUBLISHED
  REJECTED
  RESERVED
}

"""
Available urgency levels for donations
"""
enum DonationUrgencyValues {
  HIGH
  LOW
  MEDIUM
}

"""
Color of the map marker
"""
enum MarkerColorValues {
  GREEN
  ORANGE
  RED
}

enum NOTIFICATION_TYPE {
  ACCOUNT_STATUS_ALERT
  CHAT_MESSAGE
  MESSAGE
  NEW_ACHIEVEMENT
  NEW_POST
  REPORT_ALERT
  RESERVATION_ALERT
  RESERVATION_CANCELLED
  TEST
}

"""
Time period for reporting chart
"""
enum ReportStatsPeriod {
  LAST_MONTH
  LAST_WEEK
  LAST_YEAR
}

"""
Status filter for reports chart (accepted is treated as resolved)
"""
enum ReportStatsStatusFilter {
  ACCEPTED
  ALL
  OPEN
  REJECTED
  RESOLVED
  UNDER_REVIEW
}

"""
Moderation status of the report
"""
enum ReportStatus {
  OPEN
  REJECTED
  RESOLVED
  UNDER_REVIEW
}

"""
The type of entity being reported
"""
enum ReportTargetType {
  DONATION
  MESSAGE
  USER
}

enum ReservationRoleFilter {
  BENEFICIARY
  DONOR
}

"""
The possible statuses of a reservation
"""
enum ReservationStatus {
  CANCELLED
  COMPLETED
  CONFIRMED
  PENDING
}

"""
Time period for growth charts
"""
enum StatsGrowthPeriod {
  LAST_MONTH
  LAST_WEEK
  LAST_YEAR
}

enum UploadStatusValues {
  COMPLETED
  FAILED
  PENDING
  UPLOADING
}

"""
Available user roles
"""
enum UserRole {
  ADMINISTRATOR
  LOCAL_AUTHORITY
  ORGANIZATION
  STORE
  USER
}

enum VerficationStatusUpdateEnum {
  APPROVED
  REJECTED
}

"""
Status of a verification request
"""
enum VerificationRequestStatus {
  APPROVED
  PENDING
  REJECTED
}

input AdminCreateAccountInput {
  displayName: String!
  email: String!
  role: UserRole!
}

input AdminDashboardStatsInput {
  applyDonationStatusFilter: Boolean
}

input ApproveSensitiveMessageInput {
  conversationId: ID!
  messageId: ID!
}

input ChangePasswordInput {
  currentPassword: String!
  logoutFromOtherDevices: Boolean = false
  newPassword: String!
}

input ConversationMessagesInput {
  conversationId: ID!
  pagination: PaginationInput
}

input CoordinateInput {
  latitude: Float!
  longitude: Float!
}

input CreateBadgeInput {
  code: String!
  description: String!
  iconAttachmentId: String
  isActive: Boolean
  name: String!
  sortOrder: Int
}

input CreateCategoryInput {
  name: String!
  reputationGain: Int
  sensitivity: CategorySensitivity
}

input CreateDonationInput {
  attachmentIds: [String!]
  categoryId: String!
  description: String!
  expiryDate: DateTime!
  foodWeightKg: Float!
  listingExpiresAt: DateTime
  locationId: String
  locationInput: LocationInput
  mainAttachmentId: String!
  quantity: Int!
  safetyChecklistCompleted: Boolean
  specification: JSONObject
  title: String!
  urgency: DonationUrgencyValues
}

input CreateReportInput {
  description: String
  reason: String!
  targetId: String!
  targetType: ReportTargetType!
}

input DateRangeInput {
  from: DateTime!
  to: DateTime!
}

input DonationBehaviorContextInput {
  distanceBucket: String
  origin: String
}

input DonationsFilterInput {
  categoryId: String
  status: DonationStatusValues
  urgency: DonationUrgencyValues
}

input DonationsHeatmapInput {
  bounds: MapBoundsInput!
  categories: [String!]
  dateRange: DateRangeInput
  gridSize: Float = 0.01
}

input DonationsMapInput {
  latitude: Float!
  longitude: Float!
  radius: Float!
}

input LocationInput {
  city: String
  country: String
  latitude: Float
  longitude: Float
  neighborhood: String
  zipCode: String
}

input LoginInput {
  email: String!
  password: String!
}

input MapBoundsInput {
  northEast: CoordinateInput!
  southWest: CoordinateInput!
}

input MarkTransactionCompletedInput {
  conversationId: ID!
}

input PaginationInput {
  limit: Int = 10
  page: Int = 1
}

input PaginationQueryInput {
  limit: Int = 10
  page: Int = 1
}

input RegisterInput {
  displayName: String
  email: String!
  location: RegisterLocationInput!
  password: String!
  phoneNumber: String
}

input RegisterLocationInput {
  city: String
  country: String
  latitude: Float
  longitude: Float
  neighborhood: String
  zipCode: String
}

input ReportStatsInput {
  period: ReportStatsPeriod!
  statusFilter: ReportStatsStatusFilter = ALL
}

input ReservationsFilterInput {
  roleFilter: ReservationRoleFilter
  status: ReservationStatus
}

input ResetPasswordInput {
  password: String!
  token: String!
}

input ReviewReportInput {
  reportId: ID!
  status: ReportStatus!
}

input SendMessageInput {
  content: String!
  conversationId: ID!
}

input SendNotificationInput {
  body: String!
  metaData: JSON
  title: String!
  type: String!
}

input StatsGrowthInput {
  applyDonationStatusFilter: Boolean
  period: StatsGrowthPeriod!
}

input UpdateBadgeInput {
  code: String
  description: String
  iconAttachmentId: String
  isActive: Boolean
  name: String
  sortOrder: Int
}

input UpdateCategoryInput {
  name: String
  reputationGain: Int
  sensitivity: CategorySensitivity
}

input UpdateDonationInput {
  attachmentIds: [String!]
  categoryId: String
  description: String
  expiryDate: DateTime
  foodWeightKg: Float
  listingExpiresAt: DateTime
  locationId: String
  locationInput: LocationInput
  mainAttachmentId: String
  quantity: Int
  safetyChecklistCompleted: Boolean
  specification: JSONObject
  title: String
  urgency: DonationUrgencyValues
}

input UpdateProfileInput {
  avatarAttachmentId: String
  displayName: String
  email: String
  location: LocationInput
  phoneNumber: String
  settings: UserSettingsInput
}

input UpdateReadNotificationsInput {
  ids: [ID!]!
}

input UpdateVerificationStatusInput {
  id: String!
  status: VerficationStatusUpdateEnum!
}

input UserSettingsInput {
  appearance: AppearanceTheme
  isNewDonationsAlertsEnabled: Boolean
  isPushNotificationsEnabled: Boolean
  isSystemReports: Boolean
  isUrgentAlertsEnabled: Boolean
}

type Achievement {
  awardedAt: DateTime!
  badge: Badge
  badgeId: ID!
  createdAt: DateTime!
  id: ID!
  userId: ID!
}

type AdminDashboardStats {
  activeUsers: Int!
  activeUsersIncrease: Float!
  co2SavedKg: Float!
  co2SavedKgIncrease: Float!
  foodSavedKg: Float!
  foodSavedKgIncrease: Float!
  totalDonations: Int!
  totalDonationsIncrease: Float!
}

type Attachment {
  createdAt: DateTime!
  fileName: String!
  fileSize: Float!
  fileType: String!
  id: String!
  jobId: String
  updatedAt: DateTime
  uploadStatus: UploadStatusValues
  uploadedById: String!
  url: String
}

type AuthResponse {
  accessToken: String!
  refreshToken: String!
  user: User!
}

type Badge {
  code: String!
  createdAt: DateTime!
  description: String!
  iconAttachment: Attachment
  iconAttachmentId: String
  id: ID!
  isActive: Boolean!
  name: String!
  sortOrder: Int!
  updatedAt: DateTime!
}

type Category {
  createdAt: DateTime!
  id: ID!
  name: String!
  reputationGain: Int!
  sensitivity: CategorySensitivity!
  updatedAt: DateTime!
}

type ChatCounterpartPreview {
  avatarUrl: String
  displayName: String!
  isOnline: Boolean!
  userId: String!
}

type ChatMessage {
  content: String!
  conversationId: ID!
  createdAt: DateTime!
  id: ID!
  isModerated: Boolean!
  senderId: ID!
}

type Conversation {
  createdAt: DateTime!
  id: ID!
  lastMessage: String
  reservationId: ID!
  status: ConversationStatus!
}

type ConversationPreview {
  counterpart: ChatCounterpartPreview!
  createdAt: DateTime!
  id: ID!
  lastMessage: String
  reservationId: ID!
  status: ConversationStatus!
}

type DangerousDonation {
  categoryId: ID!
  categoryName: String!
  categorySensitivity: CategorySensitivity!
  donationId: ID!
  lastReportedAt: DateTime
  reportCount: Int!
  riskScore: Float!
  safetyChecklistCompleted: Boolean!
  title: String!
}

type Donation {
  approvedAt: DateTime
  approvedById: String
  attachmentIds: [String!]!
  category: Category
  categoryId: String!
  createdAt: DateTime!
  description: String!
  expiryDate: DateTime!
  foodWeightKg: Float
  id: ID!
  isLikedByMe: Boolean!
  isReservable: Boolean
  listingExpiresAt: DateTime
  location: Location
  locationId: String
  mainAttachment: Attachment
  mainAttachmentId: String
  publishedAt: DateTime
  quantity: Int!
  rejectedAt: DateTime
  rejectedById: String
  rejectionReason: String
  safetyChecklistCompleted: Boolean!
  specification: JSON
  status: DonationStatusValues!
  title: String!
  updatedAt: DateTime!
  urgency: DonationUrgencyValues!
  user: User!
  userId: String!
}

type DonationHeatmapCell {
  activeCount: Int!
  city: String
  completedCount: Int!
  donationCount: Int!
  lat: Float!
  lng: Float!
  neighborhood: String
  rawScore: Float!
  reservationCount: Int!
  score: Float!
  topCategory: String
  userCount: Int!
}

type DonationMapMarker {
  categoryId: String!
  donation: Donation!
  id: ID!
  latitude: Float!
  longitude: Float!
  mainAttachment: Attachment
  mainAttachmentId: String!
  markerColor: MarkerColorValues!
  title: String!
  urgency: DonationUrgencyValues!
}

type DonationStatistics {
  flaggedItems: Int!
  pendingApprovals: Int!
  totalActiveDonations: Int!
}

type DonationsHeatmap {
  cells: [DonationHeatmapCell!]!
  maxScore: Float!
  totalCells: Int!
}

type LeaderboardEntry {
  avatarUrl: String
  displayName: String
  rank: Int!
  score: Int!
  userId: String!
}

type Location {
  city: String
  country: String
  id: String!
  latitude: Float
  longitude: Float
  neighborhood: String
  zipCode: String
}

type MessageResponse {
  message: String!
}

type Notification {
  body: String!
  createdAt: DateTime!
  id: ID!
  isRead: Boolean!
  meta: JSON
  receiverId: String!
  title: String!
  type: NOTIFICATION_TYPE!
  updatedAt: DateTime!
}

type NotificationStats {
  unreadCount: Int!
}

type PaginatedCategories {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [Category!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedConversationPreviews {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [ConversationPreview!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedDangerousDonations {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [DangerousDonation!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedDonations {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [Donation!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedMessages {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [ChatMessage!]!
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedNotifications {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [Notification!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedReports {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [Report!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedReservations {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [Reservation!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedUsers {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [User!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type PaginatedVerificationRequests {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  items: [VerificationRequest!]
  limit: Int!
  page: Int!
  totalCount: Int!
}

type Report {
  createdAt: DateTime!
  description: String
  id: ID!
  reason: String!
  reporter: User!
  reporterId: ID!
  reviewedAt: DateTime
  reviewedById: ID
  status: ReportStatus!
  targetId: ID!
  targetType: ReportTargetType!
  updatedAt: DateTime!
}

type ReportStats {
  chart: [ReportStatsPoint!]!
  openReports: Int!
  openReportsIncrease: Float!
  totalReports: Int!
  totalReportsIncrease: Float!
}

type ReportStatsPoint {
  period: String!
  reportsCount: Int!
}

type Reservation {
  beneficiary: User
  beneficiaryId: ID!
  confirmedAt: DateTime
  createdAt: DateTime!
  donation: Donation
  donationId: ID!
  id: ID!
  quantity: Int!
  status: ReservationStatus!
  updatedAt: DateTime!
}

type SendNotificationResponse {
  message: String!
  success: Boolean!
}

type StatsGrowth {
  points: [StatsGrowthPoint!]!
}

type StatsGrowthPoint {
  donationsCount: Int!
  period: String!
  usersCount: Int!
}

type User {
  attachment: Attachment
  avatar: Attachment
  avatarAttachmentId: String
  createdAt: DateTime!
  description: String
  displayName: String
  email: String!
  id: String!
  isFoodSaver: Boolean!
  isVerified: Boolean!
  lastChangedPasswordDate: DateTime
  location: Location
  locationId: String
  phoneNumber: String
  reputationScore: Int!
  role: UserRole!
  settings: UserSettings
  status: String!
  updatedAt: DateTime!
}

type UserSettings {
  appearance: AppearanceTheme!
  id: String!
  isNewDonationsAlertsEnabled: Boolean!
  isPushNotificationsEnabled: Boolean!
  isSystemReports: Boolean!
  isUrgentAlertsEnabled: Boolean!
  userId: String!
}

type UserStats {
  activeAccounts: Int!
  activeAccountsIncrease: Float!
  reportedIssues: Int!
  reportedIssuesIncrease: Float!
  totalUsers: Int!
  totalUsersIncrease: Float!
}

type UsersDonationsStats {
  likedDonations: Float!
  totalDonations: Float!
}

type VerificationRequest {
  createdAt: DateTime!
  id: String!
  requester: User
  requesterId: String!
  status: VerificationRequestStatus!
  targetFoodSaver: User
  targetFoodSaverId: String!
  updatedAt: DateTime!
}

type Query {
  adminDangerousDonations(
    limit: Int = 20
    page: Int = 1
  ): PaginatedDangerousDonations!
  adminDashboardStats(input: AdminDashboardStatsInput): AdminDashboardStats!
  adminGetUserStats: UserStats!
  leaderboardAllTime(limit: Int = 10): [LeaderboardEntry!]!
  leaderboardLastMonth(limit: Int = 10): [LeaderboardEntry!]!
  myLeaderboardRankAllTime: LeaderboardEntry
  myLeaderboardRankLastMonth: LeaderboardEntry
  adminGetUsers(
    limit: Int = 10
    page: Int = 1
    role: UserRole
    search: String
    status: String
  ): PaginatedUsers!
  adminGrowthStats(input: StatsGrowthInput!): StatsGrowth!
  adminReportStats(input: ReportStatsInput!): ReportStats!
  adminReports(
    limit: Int = 10
    page: Int = 1
    status: ReportStatus
    targetId: String
    targetType: ReportTargetType
  ): PaginatedReports!
  badgeCatalog: [Badge!]!
  categories(pagination: PaginationInput): PaginatedCategories!
  category(id: ID!): Category!
  conversationMessages(input: ConversationMessagesInput!): PaginatedMessages!
  conversationDetails(conversationId: ID!): ConversationPreview!
  currentUser: User!
  donation(id: ID!): Donation!
  donationStatistics: DonationStatistics!
  donations(
    behaviorContext: DonationBehaviorContextInput
    filter: DonationsFilterInput
    pagination: PaginationInput
  ): PaginatedDonations!
  myDonations(
    filter: DonationsFilterInput
    pagination: PaginationInput
  ): PaginatedDonations!
  donationsHeatmap(input: DonationsHeatmapInput!): DonationsHeatmap!
  donationsMap(input: DonationsMapInput!): [DonationMapMarker!]!
  getNotifications(pagination: PaginationQueryInput): PaginatedNotifications!
  getNotificationStats: NotificationStats!
  likedDonations(
    filter: DonationsFilterInput
    pagination: PaginationInput
  ): PaginatedDonations!
  myAchievements: [Achievement!]!
  myActiveConversations: [ConversationPreview!]!
  myBadges: [Badge!]!
  myReports: [Report!]!
  myReservation(id: ID!): Reservation!
  myDonationsStats: UsersDonationsStats!
  myReservations(
    filter: ReservationsFilterInput
    pagination: PaginationInput
  ): PaginatedReservations!
  myArchivedConversations(
    pagination: PaginationInput
  ): PaginatedConversationPreviews!
  myArchivedConversationsCount: Int!

  # Verification Queries
  getSentVerificationRequests(
    pagination: PaginationInput
  ): PaginatedVerificationRequests!
  getVerificationRequestsForFoodSaver(
    pagination: PaginationInput
    search: String
  ): PaginatedVerificationRequests!
  getUsersFromSameNeighborhood(
    pagination: PaginationInput
    search: String
  ): PaginatedUsers!
}

type Mutation {
  activateUser(userId: String!): User!
  adminCreateAccount(input: AdminCreateAccountInput!): User!
  adminReviewReport(input: ReviewReportInput!): Report!
  adminUpdateUserFoodSaverStatus(isFoodSaver: Boolean!, userId: String!): User!
  adminUpdateUserVerificationStatus(
    isVerified: Boolean!
    userId: String!
  ): User!
  approveDonation(donationId: ID!): Donation!
  approveSensitiveMessage(input: ApproveSensitiveMessageInput!): ChatMessage!
  changePassword(changePasswordInput: ChangePasswordInput!): MessageResponse!
  cancelReservation(id: ID!): Reservation!
  confirmReservation(id: ID!): Reservation!
  confirmReservationCompleted(reservationId: ID!): Reservation!
  createBadge(input: CreateBadgeInput!): Badge!
  createCategory(input: CreateCategoryInput!): Category!
  createDonation(input: CreateDonationInput!): Donation!
  createReport(input: CreateReportInput!): Report!
  createVerificationRequest(targetFoodSaverId: String!): VerificationRequest!
  deleteAccount: MessageResponse!
  deleteCategory(id: ID!): MessageResponse!
  deleteDonation(id: ID!): MessageResponse!
  deleteNotification(id: ID!): MessageResponse!
  forgotPassword(email: String!): MessageResponse!
  getOrCreateConversation(reservationId: ID!): Conversation!
  likeDonation(donationId: ID!): MessageResponse!
  login(loginInput: LoginInput!): AuthResponse!
  logout: MessageResponse!
  logoutFromAllDevices: MessageResponse!
  markAllNotificationsAsRead: MessageResponse!
  markNotificationsAsRead(
    input: UpdateReadNotificationsInput!
  ): MessageResponse!
  markTransactionCompleted(input: MarkTransactionCompletedInput!): Conversation!
  refreshTokens: AuthResponse!
  register(otp: String!, registerInput: RegisterInput!): MessageResponse!
  registerFcmToken(fcmToken: String!): MessageResponse!
  rejectDonation(donationId: ID!, reason: String): Donation!
  reserveDonation(donationId: ID!, quantity: Int = 1): Reservation!
  resetPassword(resetPasswordInput: ResetPasswordInput!): MessageResponse!
  sendFcmNotification(input: SendNotificationInput!): SendNotificationResponse!
  sendMessage(input: SendMessageInput!): ChatMessage!
  sendVerification(email: String!): MessageResponse!
  suspendUser(userId: String!): User!
  unlikeDonation(donationId: ID!): MessageResponse!
  updateBadge(id: ID!, input: UpdateBadgeInput!): Badge!
  updateCategory(id: ID!, input: UpdateCategoryInput!): Category!
  updateDonation(id: ID!, input: UpdateDonationInput!): Donation!
  updateProfile(updateProfileInput: UpdateProfileInput!): User!
  updateVerificationRequestStatus(
    updateVerificationRequest: UpdateVerificationStatusInput!
  ): VerificationRequest!
}

