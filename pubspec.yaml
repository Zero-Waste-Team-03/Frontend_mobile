name: gaspzero
description: Gasp'Zero - Flutter Development Agent Brief
publish_to: 'none'
version: 0.0.1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  equatable: ^2.0.8
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dio: ^5.9.2
  ferry: ^0.16.1
  gql_http_link: ^1.2.0
  flutter_local_notifications: ^21.0.0

  # Routing
  go_router: ^17.0.0

  # Dependency Injection
  get_it: ^9.0.0
  injectable: ^2.7.1+4

  # JSON Serialization

  # Network & Connectivity
  connectivity_plus: ^7.0.0

  # OAuth & Deep Linking

  # NFC

  # Logging
  logger: ^2.7.0

  # Analytics
  firebase_core: ^4.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0

  # Caching
  socket_io_client: ^3.1.4
  maplibre_gl: ^0.23.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.2.1
  firebase_messaging: ^16.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  google_fonts: ^8.0.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4
  shimmer: ^3.0.0
  fpdart: ^1.2.0

  audioplayers: ^6.6.0
  flutter_animate: ^4.5.2

  uuid: ^4.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.13.1
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  injectable_generator: ^2.12.1
  ferry_generator: ^0.12.0
  flutter_launcher_icons: ^0.13.1

  # Testing

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo/image.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/l10n/ar.json
    - assets/l10n/en.json
    - assets/images/google_logo.svg
    - assets/icons/donations/category_bakery.svg
    - assets/icons/donations/category_cooked.svg
    - assets/icons/donations/category_dry.svg
    - assets/icons/donations/category_fresh.svg
    - assets/icons/donations/upload_photo.svg
    - assets/images/default_avatar.png
